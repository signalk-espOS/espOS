## Example app manifest. ESP32-P4 has no radio: WiFi is provided by an
## ESP32-C6 co-processor over SDIO through Espressif's esp_hosted transport
## and the esp_wifi_remote shim (same esp_wifi_* API). Both are espos_wifi's
## dependencies and are pinned there; other targets use the native driver.
dependencies:
  idf: ">=6.0.0"
