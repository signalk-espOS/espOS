#
# Dependabot for ESP-IDF components, because Dependabot does not do this: the
# component manager is not one of its ecosystems, so nothing watches
# idf_component.yml. .github/dependabot.yml covers github-actions and the UI's
# npm tree, which is all it can cover.
#
# espos-p4-cockpit answers this by re-resolving within the declared ranges and
# diffing dependencies.lock. That cannot work here, and the reason is worth
# stating: espOS pins its third-party dependencies EXACTLY, so there is nothing
# to re-resolve and the lock diff is empty however far behind the pins have
# fallen. espOS sat on esp_hosted 2.12.x for weeks while 3.x was out and
# nothing said so.
#
# So this asks the other question -- is there anything newer than what we
# pinned? -- as a registry query per dependency
# (tools/espos_registry_updates.py). On its first run it found mdns pinned
# 1.11.3 against a published 1.14.0.
#
# A `behind` pin now becomes a PULL REQUEST, one per component, with the
# manifests edited and dependencies.lock regenerated. It never pushes to main:
# a component bump changes the binary that goes on a boat, so it goes through a
# review and a build like any other change -- and one PR per component means a
# bump that turns out to be risky can be held while the others merge. esp-sr
# 2.5.3 -> 2.5.5 moved 1.42 MB out of the esp-dl portion of the speech stack
# without touching a line of espOS, which is the kind of thing a single
# combined PR would have buried.
#
# What does NOT become a pull request, and still reaches the issue: a range
# (bumping it means deciding to pin, which is policy), several different exact
# pins for one component (which one is right IS the question), and a manifest
# this tool could not read.
name: Dependency drift

# One at a time: a scheduled and a manual run overlapping could both see no
# existing issue and each file one.
concurrency:
  group: dependency-drift
  cancel-in-progress: false

on:
  schedule:
    # Mondays 06:00 UTC, matching the weekly Dependabot cadence and the
    # cockpit's own drift job.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Least privilege at the top; the one job that needs more says so itself.
permissions:
  contents: read

jobs:
  drift:
    name: registry versions against the pins
    outputs:
      bumpable: ${{ steps.check.outputs.bumpable }}
      any: ${{ steps.check.outputs.any }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole output of this job is an issue opened, commented on or
      # closed. Scoped here rather than workflow-wide so a second job added
      # later does not inherit the ability to write issues.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job reads the manifests and talks to the registry. It never
          # pushes, so it has no business keeping a credential in .git/config
          # for the rest of the run.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: ask the registry
        id: check
        run: |
          set -uo pipefail
          # `|| rc=$?` is load-bearing, and the first real run proved it: the
          # runner invokes `bash -e {0}`, so errexit arrives from OUTSIDE this
          # script and `set -uo pipefail` cannot take it away. A bare
          # `python3 ...` statement exiting 1 -- which here MEANS "something to
          # act on" -- therefore killed the step before `rc=$?` was ever read.
          # A command on the left of `||` is a conditional context, which
          # errexit exempts, so the exit code survives and the rest of the
          # script still fails loudly on a genuine error.
          rc=0
          python3 tools/espos_registry_updates.py --root . \
            --bumpable-out "$RUNNER_TEMP/bumpable.json" \
            > "$RUNNER_TEMP/report.txt" || rc=$?
          # 0 and 1 are the script's two answers. Anything else is a crash --
          # a traceback, a bad argument, an import error -- and `|| true` would
          # have turned that into an empty report, no matching lines, and a
          # green job that checked nothing. Fail loudly instead.
          if [ "$rc" -gt 1 ]; then
            echo "::error::espos_registry_updates.py exited $rc; report not usable"
            cat "$RUNNER_TEMP/report.txt" || true
            exit "$rc"
          fi
          # Random delimiter per run. The report carries manifest paths and
          # dependency names straight from the tree, so a fixed marker could
          # appear in the content and end the value early -- the runner would
          # then read the rest of the report as `key=value` output lines, or
          # reject the file.
          delim="ESPOS_$(openssl rand -hex 16)"
          {
            echo "report<<$delim"
            cat "$RUNNER_TEMP/report.txt"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          # The exit code is the authority: the script computes it from the
          # rows, while a grep re-derives it from formatted text and would
          # drift the day a column width changes. The grep stays as a
          # cross-check, and a disagreement fails rather than quietly picking
          # one -- that mismatch would mean the report and the decision had
          # come apart.
          #
          # A registry that did not answer reports `unknown`, which is not
          # actionable: an outage must never open an issue claiming a
          # component moved.
          if grep -qE '^(behind|unpinned|unparsed) ' "$RUNNER_TEMP/report.txt"; then
            grepped=1
          else
            grepped=0
          fi
          if [ "$rc" -ne "$grepped" ]; then
            echo "::error::exit code $rc disagrees with the report ($grepped actionable); format and decision have come apart"
            exit 1
          fi
          if [ "$rc" -eq 1 ]; then
            echo "act=true" >> "$GITHUB_OUTPUT"
          else
            echo "act=false" >> "$GITHUB_OUTPUT"
          fi
          # Separately: did every component actually answer? `unknown` carries
          # no exit-code signal -- it is not actionable, so rc stays 0 -- and
          # without this the closing path below would shut an issue while
          # claiming "every dependency is current" for a component the registry
          # never spoke about. This grep is the only source for that fact, not
          # a second derivation of one already computed.
          if grep -qE '^unknown ' "$RUNNER_TEMP/report.txt"; then
            echo "inconclusive=true" >> "$GITHUB_OUTPUT"
          else
            echo "inconclusive=false" >> "$GITHUB_OUTPUT"
          fi
          # And a third distinct fact, not a re-derivation either: is there
          # anything left for an ISSUE to carry? A `behind` row with one exact
          # pin becomes a pull request, and filing an issue about it as well
          # would be two notifications for one thing. What cannot become a
          # pull request still needs somewhere to land:
          #   unpinned  -- bumping it means deciding to pin, which is policy
          #   unparsed  -- a manifest nothing is watching
          #   behind, "pinned inconsistently" -- which pin is right IS the
          #              question, so a tool that picked would hide it
          if grep -qE '^(unpinned|unparsed) ' "$RUNNER_TEMP/report.txt" \
             || grep -q 'pinned inconsistently' "$RUNNER_TEMP/report.txt"; then
            echo "needs_issue=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_issue=false" >> "$GITHUB_OUTPUT"
          fi
          # The rows a pull request can be opened for, chosen in Python where
          # the rule is unit-tested, not re-derived from formatted text here --
          # and written by the SAME run that produced the report above, so the
          # two cannot disagree about what the registry said. A second query
          # could report a pin as behind and then hand an empty matrix to the
          # job that acts on it.
          bumpable=$(cat "$RUNNER_TEMP/bumpable.json")
          echo "bumpable=$bumpable" >> "$GITHUB_OUTPUT"
          if [ "$bumpable" = "[]" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/report.txt"

      # Runs on every outcome, not only when there is something to report: an
      # issue left open after the last pin was caught up says the opposite of
      # the truth, and the next reader has to re-derive it.
      - name: open, update or close the issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Through the environment, never interpolated into the script: this is
          # registry-derived text, and a backtick or ${...} in it would
          # otherwise be evaluated as JavaScript in a step holding
          # issues: write.
          REPORT: ${{ steps.check.outputs.report }}
          ACT: ${{ steps.check.outputs.needs_issue }}
          INCONCLUSIVE: ${{ steps.check.outputs.inconclusive }}
        with:
          script: |
            const title = 'Registry components newer than espOS pins'
            const act = process.env.ACT === 'true'
            const inconclusive = process.env.INCONCLUSIVE === 'true'
            const body = [
              'Asked the Espressif Component Registry for the newest published',
              'version of every third-party dependency in the manifests, and',
              'compared it with what this tree pins.',
              '',
              '```',
              process.env.REPORT ?? '',
              '```',
              '',
              '- **behind** -- an exact pin with something newer published.',
              '  A single exact pin gets its own pull request instead of a line',
              '  here; one listed below is pinned INCONSISTENTLY across',
              '  manifests, and which pin is right is the question.',
              '- **unpinned** -- a range, so the solver will take the newest it',
              '  permits whenever it next runs, without anyone deciding to.',
              '- **unparsed** -- a manifest declares dependencies this tool could',
              '  not read, so something is unwatched. Fix the tool, not the manifest.',
              '- **current** / **unknown** -- nothing to do; `unknown` is a',
              '  registry that did not answer, never a claim that something moved.',
              '',
              'Everything listed here needs a decision a tool cannot make. Bumps',
              'that CAN be taken automatically are already open as pull requests.',
              '',
              '_Raised by `.github/workflows/dependency-drift.yml`; re-runs weekly._'
            ].join('\n')

            // Paginate: the default page is 30, and an older issue sitting past
            // it would be invisible here and a duplicate filed instead.
            const existing = await github.paginate(
              github.rest.issues.listForRepo,
              { ...context.repo, state: 'open', per_page: 100 }
            )
            const mine = existing.find(i => i.title === title && !i.pull_request)

            if (!act) {
              // Nothing actionable. Only CLOSE when the report is also
              // conclusive: an `unknown` row means the registry never answered
              // for that component, so "every dependency is current" would be
              // a claim this run cannot support, and closing on it would drop
              // a standing reminder on the strength of an outage.
              if (mine && inconclusive) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: mine.number,
                  body: 'Nothing actionable this run, but the report is '
                    + '**inconclusive**: the registry did not answer for at '
                    + 'least one component (`unknown` below), so this cannot '
                    + 'say they are current. Left open.\n\n```\n'
                    + (process.env.REPORT ?? '') + '\n```'
                })
              } else if (mine) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: mine.number,
                  body: 'Every third-party dependency answered, and each is at '
                    + 'the newest published version or deliberately pinned '
                    + 'above it. Closing.\n\n```\n'
                    + (process.env.REPORT ?? '') + '\n```'
                })
                await github.rest.issues.update(
                  { ...context.repo, issue_number: mine.number, state: 'closed' })
              }
              // No existing issue: nothing to say either way. An outage is not
              // actionable, so it does not open one.
              return
            }

            if (mine) {
              await github.rest.issues.createComment(
                { ...context.repo, issue_number: mine.number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title, body })
            }

  # One pull request per component, so a bump that turns out to change
  # behaviour can be held while the others merge.
  bump:
    name: "bump ${{ matrix.dep.name }} -> ${{ matrix.dep.to }}"
    needs: drift
    if: needs.drift.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      # Serial on purpose: every one of these regenerates the same
      # dependencies.lock and pushes to the same remote. Parallel runs would
      # race on the push and interleave in the logs for no gain -- a week with
      # three bumps is a busy week.
      max-parallel: 1
      matrix:
        dep: ${{ fromJSON(needs.drift.outputs.bumpable) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No credential in .git/config. This job regenerates the lock, which
          # means the component manager downloads third-party components and
          # CMake runs their code -- with a token that can push to this
          # repository sitting in the checkout it just ran inside. A component
          # release that went bad could read it and push a branch of its own,
          # and this repository's output is firmware on a boat. The push below
          # authenticates on its own instead, after that work is done.
          persist-credentials: false

      - name: name the branch
        id: n
        run: |
          set -euo pipefail
          # The component name carries a slash, which cannot go in a branch
          # component without creating a directory level that collides with
          # other refs.
          slug=$(printf '%s' '${{ matrix.dep.name }}' | tr '/' '-')
          echo "branch=deps/$slug-${{ matrix.dep.to }}" >> "$GITHUB_OUTPUT"

      - name: skip if this bump has already been proposed
        id: exists
        env:
          GH_TOKEN: ${{ secrets.DRIFT_PR_TOKEN || github.token }}
          BRANCH: ${{ steps.n.outputs.branch }}
        run: |
          set -euo pipefail
          # Idempotent across weeks, on two counts.
          #
          # The branch still being there means a review is in progress, and a
          # later run must not force-push over it or open a second pull
          # request for the same version.
          # --exit-code returns 2 for "no matching refs" and other non-zero
          # values for a failure to ask at all. Those must not be the same
          # answer: now that the checkout holds no credential, a transport
          # error would otherwise read as "no branch" and the job would create
          # and push one over a review in progress.
          rc=0
          git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1 || rc=$?
          if [ "$rc" = 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$BRANCH exists; leaving it alone"
            exit 0
          fi
          if [ "$rc" != 2 ]; then
            echo "::error::git ls-remote failed (exit $rc); refusing to guess that $BRANCH is absent"
            exit 1
          fi
          # A pull request for this branch in ANY state means the bump was
          # already put to a human. Merging deletes the branch, and so does
          # rejecting one -- without this, a bump that was deliberately closed
          # would be reopened every Monday for as long as the pin stood, and
          # the weekly job would be arguing with the person who declined it.
          seen=$(gh pr list --head "$BRANCH" --state all --limit 1 --json number \
                   --jq 'length')
          if [ "$seen" != '0' ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$BRANCH already had a pull request; not proposing it again"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.exists.outputs.skip == 'false'
        with:
          python-version: "3.12"

      - name: edit the manifests
        if: steps.exists.outputs.skip == 'false'
        run: |
          set -euo pipefail
          # Exits non-zero when it matched nothing, which is the case that
          # would otherwise commit an empty diff and open a pull request
          # claiming a bump it never made.
          python3 tools/espos_apply_bump.py --root . \
            --name '${{ matrix.dep.name }}' \
            --from '${{ matrix.dep.from }}' \
            --to '${{ matrix.dep.to }}'

      - name: read pinned IDF version
        if: steps.exists.outputs.skip == 'false'
        id: idf
        run: echo "version=$(cat .idf-version)" >> "$GITHUB_OUTPUT"

      # The lock has to be regenerated by the component manager itself; there
      # is no way to edit it by hand that stays honest.
      - uses: espressif/esp-idf-ci-action@v1
        if: steps.exists.outputs.skip == 'false'
        with:
          esp_idf_version: ${{ steps.idf.outputs.version }}
          target: esp32s3
          command: scripts/regen_lock.sh

      - name: commit and open the pull request
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.DRIFT_PR_TOKEN || github.token }}
          BORROWED: ${{ secrets.DRIFT_PR_TOKEN == '' }}
          NAME: ${{ matrix.dep.name }}
          FROM: ${{ matrix.dep.from }}
          TO: ${{ matrix.dep.to }}
          BRANCH: ${{ steps.n.outputs.branch }}
        run: |
          set -euo pipefail
          # The IDF container runs as root, so anything it wrote is root-owned
          # and git would refuse to add it.
          sudo chown -R "$(id -u):$(id -g)" .
          git config user.name 'espOS dependency drift'
          git config user.email 'noreply@github.com'
          git checkout -b "$BRANCH"
          git add -A -- '*idf_component.yml' dependencies.lock
          # Nothing staged means the edit and the regeneration both did
          # nothing, which is a bug in this workflow rather than a quiet week.
          if git diff --cached --quiet; then
            echo "::error::nothing to commit after a bump that reported success"
            exit 1
          fi
          git commit \
            -m "chore(deps): $NAME $FROM -> $TO" \
            -m "The registry publishes $TO and this tree pinned $FROM." \
            -m "Manifests edited by tools/espos_apply_bump.py, dependencies.lock regenerated by scripts/regen_lock.sh on esp32s3. Nothing here has been built for a device or flashed."
          # Supplied through askpass rather than a remote URL or an argument,
          # so the token never reaches .git/config or a process listing.
          askpass="$RUNNER_TEMP/askpass"
          # shellcheck disable=SC2016  # $GH_TOKEN is read when git runs this,
          # not when the file is written -- expanding it here is exactly what
          # must not happen, since it would write the token into a file.
          printf '#!/bin/sh\nexec printf %%s "$GH_TOKEN"\n' > "$askpass"
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push "https://x-access-token@github.com/$GITHUB_REPOSITORY.git" "$BRANCH"
          # Values appended rather than interpolated into the template, so a
          # version string cannot be read as markdown structure.
          body="$RUNNER_TEMP/body.md"
          cp .github/drift-pr-body.md "$body"
          # shellcheck disable=SC2016  # the backticks are markdown for the
          # body being written, not a substitution anyone wants performed; the
          # values arrive as %s arguments.
          printf '\n`%s`: `%s` -> `%s`\n' "$NAME" "$FROM" "$TO" >> "$body"
          if [ "$BORROWED" = 'true' ]; then
            cat .github/drift-pr-no-token.md >> "$body"
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "chore(deps): $NAME $FROM -> $TO" --body-file "$body"
