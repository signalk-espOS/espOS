#
# Keeps the open component bump pull requests (deps/* branches, opened by
# dependency-drift.yml) mergeable after main moves.
#
# dependencies.lock ends in one manifest_hash over every idf_component.yml, so
# any two pull requests that touch a manifest conflict on that line: merging
# one bump, or a release that rewrites every espos_* manifest, leaves every
# other open bump conflicting. dependency-drift.yml never touches a branch it
# already pushed, so nothing healed them and each needed a regeneration by
# hand.
#
# On every push to main that changes a manifest or the lock, this merges main
# into each open bump branch, takes main's side of a dependencies.lock conflict
# and regenerates it, the same way release-please.yml's release-lock job keeps
# the release branch in step. A merge rather than a rebuild, so a commit
# someone pushed onto a bump branch survives. Any other conflict needs a person
# and fails the job. A bump main already carries, or has moved past (a newer
# version of the same component merged first), is closed as superseded.
name: Refresh bump pull requests

on:
  push:
    branches: [main]
    paths:
      - '**/idf_component.yml'
      - dependencies.lock
  # Retries a refresh a concurrent push to the branch refused; a branch that
  # already contains main costs one API call and a fetch.
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

# A newer push to main supersedes a refresh still running against the old one.
concurrency:
  group: refresh-bump-prs
  cancel-in-progress: true

permissions: {}

jobs:
  list:
    name: open bump pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      branches: ${{ steps.list.outputs.branches }}
    steps:
      - name: list deps/* pull requests from this repository
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A fork's branch is not ours to push to.
          branches=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json headRefName,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not) | .headRefName
                   | select(startswith("deps/"))]')
          echo "branches=$branches" >> "$GITHUB_OUTPUT"
          echo "Open bump branches: $branches"

  refresh:
    name: "refresh ${{ matrix.branch }}"
    needs: list
    if: needs.list.outputs.branches != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # gh pr close, for a bump main already carries.
      pull-requests: write
    strategy:
      fail-fast: false
      # Serial, like the bump job: each run fetches main and pushes, and a week
      # rarely has more than three of these open.
      max-parallel: 1
      matrix:
        branch: ${{ fromJSON(needs.list.outputs.branches) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          # The lock regeneration runs third-party component code; no token in
          # .git/config while it does. The push below authenticates on its own.
          persist-credentials: false

      - name: bring main into the bump branch
        id: merge
        env:
          GH_TOKEN: ${{ secrets.DRIFT_PR_TOKEN || github.token }}
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          git config user.name 'espOS dependency drift'
          git config user.email 'noreply@github.com'
          git fetch --quiet origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "$BRANCH already contains main."
            echo "act=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Nothing left to bump when main already pins this version or a
          # newer one: a newer bump of the same component merged first. Merging
          # main would then conflict in the manifests, so this is asked first,
          # against a copy of main. The title rather than a commit subject,
          # because the title is what dependency-drift.yml wrote and a person
          # pushing to the branch does not change it.
          title=$(gh pr view "$BRANCH" -R "$GITHUB_REPOSITORY" --json title --jq .title)
          re='^chore\(deps\): ([^ ]+) ([^ ]+) -> ([^ ]+)$'
          if [[ "$title" =~ $re ]]; then
            git worktree add --quiet --detach "$RUNNER_TEMP/main" origin/main
            rc=0
            python3 tools/espos_apply_bump.py --root "$RUNNER_TEMP/main" --superseded \
              --name "${BASH_REMATCH[1]}" --from "${BASH_REMATCH[2]}" \
              --to "${BASH_REMATCH[3]}" || rc=$?
            git worktree remove --force "$RUNNER_TEMP/main"
            if [ "$rc" = 0 ]; then
              # The closed pull request is what keeps dependency-drift.yml from
              # proposing the bump again, so the branch can go.
              gh pr close "$BRANCH" -R "$GITHUB_REPOSITORY" --delete-branch \
                --comment "main already pins ${BASH_REMATCH[1]} ${BASH_REMATCH[3]} or newer, so this bump is superseded. Closed by refresh-bump-prs.yml."
              echo "act=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$rc" != 1 ]; then
              echo "::error::espos_apply_bump.py --superseded exited $rc for '$title'"
              exit 1
            fi
          else
            echo "::warning::'$title' is not a dependency-drift title; not checking whether main superseded it"
          fi
          if ! git merge --no-edit --no-ff origin/main; then
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ "$conflicts" != "dependencies.lock" ]; then
              echo "::error::Merging main into $BRANCH conflicts outside dependencies.lock: $conflicts"
              exit 1
            fi
            # Main's side; the regeneration below rewrites it for this bump.
            git checkout --theirs dependencies.lock
            git add dependencies.lock
            git commit --no-edit
          fi
          # The regeneration runs third-party component code over this
          # checkout, .git included, and the push afterwards holds a token. A
          # hook or config key planted in between would run with it, so both
          # are put back from here, outside what the IDF container mounts.
          mkdir -p "$RUNNER_TEMP/git-pristine"
          cp .git/config "$RUNNER_TEMP/git-pristine/config"
          echo "act=true" >> "$GITHUB_OUTPUT"

      - name: read pinned IDF version
        if: steps.merge.outputs.act == 'true'
        id: idf
        run: echo "version=$(cat .idf-version)" >> "$GITHUB_OUTPUT"

      - uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        if: steps.merge.outputs.act == 'true'
        with:
          esp_idf_version: ${{ steps.idf.outputs.version }}
          target: esp32s3
          command: scripts/regen_lock.sh

      - name: commit the regenerated lock and push
        if: steps.merge.outputs.act == 'true'
        env:
          GH_TOKEN: ${{ secrets.DRIFT_PR_TOKEN || github.token }}
          BORROWED: ${{ secrets.DRIFT_PR_TOKEN == '' }}
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          # The IDF container runs as root, so anything it wrote is root-owned
          # and git would refuse to add it.
          sudo chown -R "$(id -u):$(id -g)" .
          cp "$RUNNER_TEMP/git-pristine/config" .git/config
          rm -rf .git/hooks
          git config user.name 'espOS dependency drift'
          git config user.email 'noreply@github.com'
          if ! git diff --quiet -- dependencies.lock; then
            git add dependencies.lock
            git commit -m "chore(deps): regenerate dependencies.lock on main" \
              -m "Main moved under this bump; scripts/regen_lock.sh on esp32s3 brings the lock along."
          fi
          # Supplied through askpass rather than a remote URL or an argument,
          # so the token never reaches .git/config or a process listing.
          askpass="$RUNNER_TEMP/askpass"
          # shellcheck disable=SC2016  # $GH_TOKEN is read when git runs this.
          printf '#!/bin/sh\nexec printf %%s "$GH_TOKEN"\n' > "$askpass"
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          # A fast-forward of what was checked out: if someone pushed to the
          # branch meanwhile, the push is refused and the daily run retries.
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push "https://x-access-token@github.com/$GITHUB_REPOSITORY.git" "HEAD:$BRANCH"
          if [ "$BORROWED" = "true" ]; then
            echo "::warning::DRIFT_PR_TOKEN is not set, so CI does not run on the refreshed $BRANCH. Close and reopen its pull request to run CI on the new head."
          fi
