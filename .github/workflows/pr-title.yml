#
# The PR title is the changelog entry. Pull requests are squash-merged with the
# title as the commit subject; release-please picks the next version from those
# subjects, and label-by-title.yml sorts each into its release-notes section by
# the title's type -- so a title that is not a Conventional Commit fails here
# instead of counting for no version and landing under Other.
#
# pull_request_target so the check also runs on pull requests from forks; it
# reads only the title and checks out no code.
name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: title is a Conventional Commit
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            revert
            docs
            test
            build
            ci
            chore
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >-
            The subject "{subject}" must start with a lower-case letter, e.g.
            "fix(wifi): keep the portal up while a scan runs".
