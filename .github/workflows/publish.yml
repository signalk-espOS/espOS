#
# Publish every espos_* component to the Espressif Component Registry.
#
# Called by release-please.yml once merging the release PR has created a tag.
# A registry version is IMMUTABLE -- publishing a tag whose manifests disagree
# with version.txt cannot be undone, only yanked -- so that agreement is
# re-checked here rather than assumed from ci.yml, which is a separate
# workflow that this one cannot depend on.
#
# The upload order matters: the registry resolves a component's dependencies
# when it accepts the upload, so a component must not arrive before the ones
# it names. scripts/registry_order.py computes that from the manifests rather
# than reading a list -- docs/releasing.md carried a hand-written list of
# eleven while the tree had nineteen, and every component added since it was
# written was missing from it.
name: publish

on:
  workflow_call:
    inputs:
      tag:
        description: "The release tag to publish (v<version>)"
        type: string
        required: true
      dry_run:
        description: "Validate without publishing"
        type: boolean
        default: false
  # Rehearsal. A first publish, or any manifest change, is worth a dry run
  # against the real registry: it validates the archive and the dependency
  # resolution without creating a version that can never be taken back.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate without publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Cheap, and it fails the release before anything is uploaded rather than
  # part-way through: half the components published is the one state that
  # cannot be rolled back.
  order:
    name: dependency order is publishable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      components: ${{ steps.order.outputs.components }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: order
        run: |
          ./scripts/registry_order.py --check
          echo "components=$(./scripts/registry_order.py)" >> "$GITHUB_OUTPUT"

  # Re-checked here rather than assumed: "the release PR probably had the
  # right numbers" is not a good enough reason to create an immutable version.
  version:
    name: tag matches version.txt
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - env:
          TAG: ${{ inputs.tag }}
        run: |
          tag="${TAG#v}"
          file="$(cat version.txt)"
          echo "tag=$tag version.txt=$file"
          test "$tag" = "$file"
          for m in components/espos_*/idf_component.yml; do
            v="$(grep -m1 '^version:' "$m" | sed 's/version:[[:space:]]*//; s/"//g')"
            test "$v" = "$file" || { echo "$m: version $v != $file"; exit 1; }
          done

  upload:
    name: upload to the registry
    needs: [order, version]
    # `always()` so a dispatched dry run (where `version` is skipped, not run)
    # still reaches this; the explicit result test is what keeps a failed
    # version check fatal.
    if: always() && needs.order.result == 'success' && needs.version.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The OIDC token the registry trusts; nothing here writes to the repo.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Components carry no submodules, but the checkout is also what the
          # pack step reads: shallow is fine, complete is not.
          fetch-depth: 1

      - name: what will be uploaded, and in what order
        id: list
        run: |
          echo "${{ needs.order.outputs.components }}" | tr ' ' '\n' | nl
          # One "name:path" pair per line, in dependency order: the action
          # uploads them one at a time, in the order given (upload.py's
          # upload_components loop), which is what the registry needs -- it
          # resolves a component's dependencies when it accepts the upload.
          {
            echo "components<<EOF"
            for c in ${{ needs.order.outputs.components }}; do echo "$c:components/$c"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Espressif's action rather than a compote loop of our own, because it
      # is the only path that authenticates with GitHub OIDC: with no
      # api_token it exchanges the job's id-token for a registry token
      # (upload.py's ensure_token), so no long-lived secret exists anywhere.
      # The namespace's trusted uploaders on the registry say which repository,
      # workflow and branch may do that. A dry run skips authentication
      # entirely, so it rehearses without any credential at all.
      - name: upload
        uses: espressif/upload-components-ci-action@v2.2.1
        with:
          namespace: signalk-espos
          components: ${{ steps.list.outputs.components }}
          dry_run: ${{ inputs.dry_run == true && 'true' || '' }}
