# Weekly dependency PRs. Subjects follow the Conventional Commit types the
# repo uses (CONTRIBUTING.md), so the PR title check passes them and
# release-please files them under its hidden "Internal" section (ci and build
# types) without anyone touching them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"

  # One grouped PR for the UI toolchain instead of one per package: the
  # vite/preact/typescript trio moves together and is tested together
  # (`npm ci && npm run build` in the ui job).
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      ui:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
