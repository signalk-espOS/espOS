## espos_eth component manifest: registry metadata for signalk-espos/espos_eth.
## The version is espOS's (version.txt) and moves with it, see docs/releasing.md.
# x-release-please-start-version
version: "0.25.2"
# x-release-please-end
description: "Wired Ethernet (internal EMAC + RMII PHY, or a W5500 on SPI) as an espos_net transport; preferred over WiFi when both are up"
url: "https://github.com/signalk-espOS/espOS/tree/main/components/espos_eth"
repository: "https://github.com/signalk-espOS/espOS.git"
documentation: "https://github.com/signalk-espOS/espOS/blob/main/docs/net.md"
issues: "https://github.com/signalk-espOS/espOS/issues"
license: "Apache-2.0"
maintainers:
  - "Dirk Wahrheit <dirkwahrheit@gmail.com>"
tags:
  - signalk
  - marine
  - esp-idf
  - espos
  - ethernet
  - poe
  - w5500
files:
  exclude:
    - "build/**/*"
    - "build-*/**/*"
    - "sdkconfig*"
    - "managed_components/**/*"
    - "dependencies.lock"
dependencies:
  idf: ">=6.0.0,<6.1.0"
  # The network seam this transport reports into. override_path makes an
  # in-tree build (and a firmware that vendors espOS as a submodule) use the
  # checkout next to this file; a registry copy has no such directory.
  signalk-espos/espos_net:
    # x-release-please-start-version
    version: "^0.25.2"
    # x-release-please-end
    override_path: "../espos_net"
  # IDF 6 moved the SPI Ethernet drivers to the registry. Exact, like every
  # other registry dependency in espOS, and wiznet_common too, which w5500
  # would otherwise take at ^1.1.0. Not on the linux target, where there is no
  # esp_eth to build them against.
  espressif/w5500:
    version: "==2.0.1"
    rules:
      - if: "target != linux"
  espressif/wiznet_common:
    version: "==1.1.0"
    rules:
      - if: "target != linux"
