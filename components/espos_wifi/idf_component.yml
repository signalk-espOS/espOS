## espos_wifi component manifest: registry metadata for signalk-espos/espos_wifi.
## The version is espOS's (version.txt) and moves with it, see docs/releasing.md.
# x-release-please-start-version
version: "0.8.2"
# x-release-please-end
description: "Station + provisioning portal, a pure-C state machine, static IP, co-processor watchdog; reports into espos_net"
url: "https://github.com/signalk-espOS/espOS/tree/main/components/espos_wifi"
repository: "https://github.com/signalk-espOS/espOS.git"
documentation: "https://github.com/signalk-espOS/espOS/blob/main/docs/wifi.md"
issues: "https://github.com/signalk-espOS/espOS/issues"
license: "Apache-2.0"
maintainers:
  - "Dirk Wahrheit <dirkwahrheit@gmail.com>"
tags:
  - signalk
  - marine
  - esp-idf
  - espos
  - wifi
  - provisioning
  - captive-portal
files:
  exclude:
    - "build/**/*"
    - "build-*/**/*"
    - "sdkconfig*"
    - "managed_components/**/*"
    - "dependencies.lock"
    - "examples/*/build/**/*"
    - "examples/*/build-*/**/*"
    - "examples/*/managed_components/**/*"
    - "examples/*/dependencies.lock"
    - "examples/*/sdkconfig*"
    - "examples/*/*.pem"
dependencies:
  idf: ">=6.0.0,<6.1.0"
  # Sibling espOS components. override_path makes an in-tree build (and a
  # firmware that vendors espOS as a submodule) use the checkout next to this
  # file instead of downloading espos/<name> from the registry; a copy fetched
  # from the registry has no such directory and the field is ignored there.
  signalk-espos/espos_config:
    # x-release-please-start-version
    version: "^0.8.2"
    # x-release-please-end
    override_path: "../espos_config"
  signalk-espos/espos_httpd:
    # x-release-please-start-version
    version: "^0.8.2"
    # x-release-please-end
    override_path: "../espos_httpd"
  # The network seam the station reports into; it owns the hostname, the
  # device id and the mDNS responder (espressif/mdns is its dependency now).
  signalk-espos/espos_net:
    # x-release-please-start-version
    version: "^0.8.2"
    # x-release-please-end
    override_path: "../espos_net"
  # cJSON, exact-pinned like every other registry dependency here.
  espressif/cjson: "==1.7.19~2"
  # The ESP32-P4 has no radio: WiFi comes from the C6 co-processor through
  # esp_hosted, and the co-processor watchdog includes its headers on that
  # target. Same pin as espos_ble.
  espressif/esp_hosted:
    version: "^2.12.0"
    rules:
      - if: "target == esp32p4"
  # esp_hosted's own manifest declares only idf, so the Wi-Fi API shim that
  # makes esp_wifi_* calls reach the co-processor has to be named here or by
  # every consumer; naming it once is the point of the component.
  espressif/esp_wifi_remote:
    version: "*"
    rules:
      - if: "target == esp32p4"
  signalk-espos/espos_event:
    # x-release-please-start-version
    version: "^0.8.2"
    # x-release-please-end
    override_path: "../espos_event"
