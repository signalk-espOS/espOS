## ble_gateway example manifest. The espOS components come from the tree
## through EXTRA_COMPONENT_DIRS (the prologue), so there is nothing of espOS
## to declare. The ESP32-P4 has no radio of its own: WiFi and Bluetooth both
## reach an ESP32-C6 co-processor over SDIO via esp_hosted.
dependencies:
  idf: ">=6.0.0,<6.1.0"
  espressif/esp_wifi_remote:
    version: "*"
    rules:
      - if: "target == esp32p4"
  espressif/esp_hosted:
    version: "==3.0.9"
    # Exact, not a range: 3.0 renamed fourteen host-side Kconfig keys,
    # and IDF drops an assignment to a symbol that no longer exists
    # without a word -- so a minor bump that renames again gives a P4
    # with no WiFi and no build error (docs/wifi.md). The weekly
    # registry-smoke workflow is where a newer version gets tried.
    rules:
      - if: "target == esp32p4"
