## espos_ble component manifest: registry metadata for signalk-espos/espos_ble.
## The version is espOS's (version.txt) and moves with it, see docs/releasing.md.
# x-release-please-start-version
version: "0.9.1"
# x-release-please-end
description: "BLE gateway: bridges Bluetooth Low Energy devices to signalk-server's BLE provider API"
url: "https://github.com/signalk-espOS/espOS/tree/main/components/espos_ble"
repository: "https://github.com/signalk-espOS/espOS.git"
documentation: "https://github.com/signalk-espOS/espOS/blob/main/docs/ble.md"
issues: "https://github.com/signalk-espOS/espOS/issues"
license: "Apache-2.0"
maintainers:
  - "Dirk Wahrheit <dirkwahrheit@gmail.com>"
tags:
  - signalk
  - marine
  - esp-idf
  - espos
  - ble
  - bluetooth
  - gateway
files:
  exclude:
    - "build/**/*"
    - "build-*/**/*"
    - "sdkconfig*"
    - "managed_components/**/*"
    - "dependencies.lock"
    - "examples/*/build/**/*"
    - "examples/*/build-*/**/*"
    - "examples/*/managed_components/**/*"
    - "examples/*/dependencies.lock"
    # The GENERATED sdkconfig only. Not "sdkconfig*": that glob also matched
    # the tracked sdkconfig.defaults[.<target>] files, which for an example
    # without the prologue ARE the example -- a downloaded from_registry was
    # missing the nine settings espos_core then refused to build without.
    - "examples/*/sdkconfig"
    - "examples/*/sdkconfig.old"
    - "examples/*/*.pem"
dependencies:
  idf: ">=6.0.0,<6.1.0"
  # Sibling espOS components. override_path makes an in-tree build (and a
  # firmware that vendors espOS as a submodule) use the checkout next to this
  # file instead of downloading espos/<name> from the registry; a copy fetched
  # from the registry has no such directory and the field is ignored there.
  signalk-espos/espos_config:
    # x-release-please-start-version
    version: "^0.9.1"
    # x-release-please-end
    override_path: "../espos_config"
  signalk-espos/espos_httpd:
    # x-release-please-start-version
    version: "^0.9.1"
    # x-release-please-end
    override_path: "../espos_httpd"
  signalk-espos/espos_sk:
    # x-release-please-start-version
    version: "^0.9.1"
    # x-release-please-end
    override_path: "../espos_sk"
  # ble_proto.c includes cJSON.h and builds on every target, linux included.
  # Same exact pin as espos_httpd, per the repo's registry-pinning convention.
  espressif/cjson: "==1.7.19~2"
  # The control channel is a WebSocket client; not part of IDF core.
  espressif/esp_websocket_client:
    version: "^1.5.0"
    rules:
      - if: "target != linux"
  # The ESP32-P4 has no radio: the backend routes HCI to the C6 co-processor
  # through esp_hosted, so it includes those headers on that target.
  espressif/esp_hosted:
    version: "^2.12.0"
    rules:
      - if: "target == esp32p4"
  signalk-espos/espos_event:
    # x-release-please-start-version
    version: "^0.9.1"
    # x-release-please-end
    override_path: "../espos_event"
